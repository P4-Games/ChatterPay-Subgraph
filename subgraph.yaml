specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: ChatterPayFactory
    network: scroll
    source:
      address: "0xE17Ca047427557C3bdeD9d151a823D8e2B514e74"
      abi: ChatterPayFactory
      startBlock: 15400000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - ChatterPayAccount
        - DefaultTokensUpdated
        - NewImplementation
        - ProxyCreated
      abis:
        - name: ChatterPayFactory
          file: ./abis/ChatterPayFactory.json
      eventHandlers:
        - event: DefaultTokensUpdated(address[],address[])
          handler: handleDefaultTokensUpdated
        - event: NewImplementation(indexed address)
          handler: handleNewImplementation
        - event: ProxyCreated(indexed address,indexed address)
          handler: handleProxyCreated
      file: ./src/chatterpay.ts

  - kind: ethereum
    name: USDT
    network: scroll
    source:
      address: "0xf55bec9cafdbe8730f096aa55dad6d22d44099df"  # Scroll USDT
      abi: USDT
      startBlock: 15400000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Approval
        - OwnershipTransferred
        - Transfer
        - ChatterPayTransfer
      abis:
        - name: USDT
          file: ./abis/USDT.json
      eventHandlers:
        - event: Approval(indexed address,indexed address,uint256)
          handler: handleApproval
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleUSDTTransfer
      file: ./src/chatterpay.ts

  - kind: ethereum
    name: WETH
    network: scroll
    source:
      address: "0x5300000000000000000000000000000000000004"  # Scroll WETH
      abi: WETH
      startBlock: 15400000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - WETHApproval
        - WETHOwnershipTransferred
        - WETHTransfer
        - ChatterPayTransfer
      abis:
        - name: WETH
          file: ./abis/WETH.json
      eventHandlers:
        - event: Approval(indexed address,indexed address,uint256)
          handler: handleWETHApproval
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleWETHOwnershipTransferred
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleWETHTransfer
      file: ./src/chatterpay.ts

  - kind: ethereum
    name: WBTC
    network: scroll
    source:
      address: "0x3C1BCa5a656e69edCD0D4E36BEbb3FcDAcA60Cf1"  # Scroll WBTC
      abi: WBTC
      startBlock: 15400000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - WBTCApproval
        - WBTCOwnershipTransferred
        - WBTCTransfer
        - ChatterPayTransfer
      abis:
        - name: WBTC
          file: ./abis/WBTC.json
      eventHandlers:
        - event: Approval(indexed address,indexed address,uint256)
          handler: handleWBTCApproval
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleWBTCOwnershipTransferred
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleWBTCTransfer
      file: ./src/chatterpay.ts
